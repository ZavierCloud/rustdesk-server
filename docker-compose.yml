version: '3'

networks:
  rd_server-net:
    external: false

services:
  rd_server_id:
    container_name: rd_server_id
    ports:
      - 21125:21125
      - 21126:21126
      - 21126:21126/udp
      - 21128:21128
    image: rd_server:latest
    build: .
    command: rd_server_id -r net.spidercloude.com:21127
    volumes:
      - ./data:/root
    networks:
      - rd_server-net
    depends_on:
      - rd_server_relay
    restart: unless-stopped

  rd_server_relay:
    container_name: rd_server_relay
    ports:
      - 21127:21127
      - 21129:21129
    image: rd_server:latest
    build: .
    command: rd_server_relay
    volumes:
      - ./data:/root
    networks:
      - rd_server-net
    restart: unless-stopped
