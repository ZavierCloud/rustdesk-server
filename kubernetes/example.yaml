apiVersion: apps/v1
kind: Deployment
metadata:
  name: rd_server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rd_server
  template:
    metadata:
      labels:
        app: rd_server
    spec:
      containers:
        # id Server (rd_server_id)
        - name: rd_server_id
          image: rd_server/rd_server:latest
          env:
            - name: RELAY_HOST
              value: "rd_server.yourdomain.tld"
          command: ["rd_server_id", "-r", "$(RELAY_HOST):21127", "-k", "_"]
          volumeMounts:
            - mountPath: /root
              name: rd_server-data
          ports:
            - containerPort: 21125
            - containerPort: 21126
              protocol: TCP
            - containerPort: 21126
              protocol: UDP
            - containerPort: 21128

        # Relay Server (rd_server_relay)
        - name: rd_server_relay
          image: rd_server/rd_server:latest
          command: ["rd_server_relay", "-k", "_"]
          volumeMounts:
            - mountPath: /root
              name: rd_server-data
          ports:
            - containerPort: 21127
            - containerPort: 21129

      volumes:
        - name: rd_server-data
          persistentVolumeClaim:
            claimName: rd_server-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rd_server-service
spec:
  type: LoadBalancer # Or NodePort
  selector:
    app: rd_server
  ports:
    - name: rd_server_id-tcp
      port: 21125
      targetPort: 21125
      protocol: TCP
    - name: rd_server_id-udp
      port: 21126
      targetPort: 21126
      protocol: UDP
    - name: rd_server_id-tcp-main
      port: 21126
      targetPort: 21126
      protocol: TCP
    - name: rd_server_relay-tcp
      port: 21127
      targetPort: 21127
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rd_server-pvc
spec:
  accessModes:
    - ReadWriteOnce # RWM would be available only with pro version
  resources:
    requests:
      storage: 1Gi
